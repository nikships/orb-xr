[versions]
# AGP 9 ships built-in Kotlin, so the kotlin-android plugin is gone.
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
lifecycleRuntimeCompose = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# Jetpack XR — September 9 2026 release. scenecore/runtime/arcore are rc01
# (API frozen); compose still trails at alpha17.
xrCompose = "1.0.0-alpha17"
xrSceneCore = "1.0.0-rc01"
xrRuntime = "1.0.0-rc01"
# ARCore for Jetpack XR — hand tracking (palm-up reveal of the hand menu).
xrArcore = "1.0.0-rc01"
# Stub API needed on the compile classpath (R8/runtime split); compileOnly.
extensionsXr = "1.4.0"
camerax = "1.6.2"
mlkitBarcode = "17.3.0"
securityCrypto = "1.1.0"
okhttp = "5.5.0"
json = "20260814"
# Firebase AI Logic — Gemini Live API (voice command control). BoM manages the
# firebase-ai version; google-services maps google-services.json into resources.
firebaseBom = "34.19.0"
googleServices = "4.5.0"
# JSON types used in the Gemini Live function-call args/results (firebase-ai
# exposes kotlinx-serialization-json in its public API; we depend on it directly
# so our controller + its tests compile without relying on a transitive).
kotlinxSerializationJson = "1.11.0"
# Play Billing — Pro subscription purchase flow (monetization).
billing = "9.1.0"
# Task.await() bridges for Firebase Auth / App Check / Firestore calls.
coroutinesPlayServices = "1.11.0"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRules = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestUiAutomator = "2.4.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "androidxTestUiAutomator" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-xr-compose = { group = "androidx.xr.compose", name = "compose", version.ref = "xrCompose" }
androidx-xr-scenecore = { group = "androidx.xr.scenecore", name = "scenecore", version.ref = "xrSceneCore" }
androidx-xr-runtime = { group = "androidx.xr.runtime", name = "runtime", version.ref = "xrRuntime" }
androidx-xr-arcore = { group = "androidx.xr.arcore", name = "arcore", version.ref = "xrArcore" }
androidx-xr-extensions = { group = "com.android.extensions.xr", name = "extensions-xr", version.ref = "extensionsXr" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
okhttp-bom = { group = "com.squareup.okhttp3", name = "okhttp-bom", version.ref = "okhttp" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver" }
# Real org.json impl for host-JVM unit tests; the android.jar stub returns
# default values, which would make response-parsing tests meaningless.
json = { group = "org.json", name = "json", version.ref = "json" }
# Firebase AI Logic client SDK; version is supplied by the Firebase BoM, so no
# version.ref here. Carries the Gemini Live API (liveModel + function calling).
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-ai = { group = "com.google.firebase", name = "firebase-ai" }
# Anonymous auth + App Check (Play Integrity) + Firestore entitlement listener.
# Versions come from the Firebase BoM.
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-appcheck-playintegrity = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }
firebase-appcheck-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
# Play Billing for the Pro subscription.
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesPlayServices" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
